                <h3 class="text-xl font-bold text-white">Applying Fingerprint</h3>
            </div>
            <div id="modalMessage" class="text-gray-400 text-xs bg-gray-800/50 p-3 rounded-lg border border-gray-700 font-mono break-all">
                Spoofing device specs & routing proxy...

    <main class="flex-grow flex flex-col relative w-full bg-white overflow-hidden">
        <div id="splashScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 z-0 px-4 text-center">
            <div class="gemini-glow-wrapper rounded-full p-1 mb-4">
                <div class="bg-gray-900 rounded-full p-4">
                    <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8V7a4 4 0 00-8 0v4h8z"></path></svg>

            <p class="text-gray-400 text-xs mt-2 max-w-xs">Test on deviceinfo.me to verify spoofed specs.</p>
        </div>

        <iframe id="browserFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" class="w-full h-full border-none hidden z-10 bg-white" src="about:blank"></iframe>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlInput = document.getElementById('urlInput');
            const countrySelect = document.getElementById('countrySelect');
            const deviceSelect = document.getElementById('deviceSelect');
            const browseBtn = document.getElementById('browseBtn');
            const browserFrame = document.getElementById('browserFrame');
            const splashScreen = document.getElementById('splashScreen');
            
            const customModal = document.getElementById('customModal');
            const modalContent = document.getElementById('modalContent');
            const modalMessage = document.getElementById('modalMessage');

            function formatUrl(url) {
                let formattedUrl = url.trim();
                if (!formattedUrl) return '';
                if (!/^https?:\/\//i.test(formattedUrl)) {
                    formattedUrl = 'https://' + formattedUrl;
                }
                return formattedUrl;
            }

            function executeProxyConnection(targetUrl) {
                const formattedUrl = formatUrl(targetUrl);
                const proxyChoice = countrySelect.value;
                const deviceChoice = deviceSelect.value;
                const deviceText = deviceSelect.options[deviceSelect.selectedIndex].text;

                urlInput.value = formattedUrl;
                modalMessage.innerHTML = `Target: <span class="text-white">${formattedUrl}</span><br>Device: <span class="text-purple-400">${deviceText}</span><br><br><span class="text-green-400 text-xs">⚡ Spoofing device properties...</span>`;
                
                customModal.classList.remove('hidden');
                setTimeout(() => {
                    customModal.classList.remove('opacity-0');
                    modalContent.classList.remove('scale-95');
                    modalContent.classList.add('scale-100');
                }, 10);

                setTimeout(() => {
                    customModal.classList.add('opacity-0');
                    modalContent.classList.remove('scale-100');
                    modalContent.classList.add('scale-95');
                    
                    setTimeout(() => {
                        customModal.classList.add('hidden');
                        splashScreen.classList.add('hidden');
                        browserFrame.classList.remove('hidden');
                        browserFrame.src = `/proxy?url=${encodeURIComponent(formattedUrl)}&country=${proxyChoice}&device=${deviceChoice}`;
                    }, 150);
                }, 500);
            }

            browseBtn.addEventListener('click', () => {
                const url = urlInput.value.trim();
                if (!url) return;
                executeProxyConnection(url);
            });

            urlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') browseBtn.click();
            });
        });
    </script>
